<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhishGuard AI</title>

    <link rel="stylesheet" href="index.css">
</head>
<body>
    <!-- ================= NAVBAR ================= -->
    <header>
        <nav>
           <h2>🛡️ PhishGuard AI</h2>
           <ul>
              <li><a href="#">Home</a></li>
              <li><a href="#">Features</a></li>
              <li><a href="#">About</a></li>
           </ul>
           <button class="nav-btn">Scan Now</button>
        </nav>
    </header>
    <!-- ================= HERO ================= -->
    <main>
        <section id="hero">
            <h1>Detect Phishing Emails & URLs</h1>
            <p>
                Paste a suspicious email or URL below and let
                PhishGuard AI analyze it.
            </p>
        </section>
        <!-- ================= ANALYZER ================= -->
        <section id="analyzer">
            <div class="card">
                <h2>Analyze Content</h2>
                <textarea
                    id="userInput"
                    placeholder="Paste a suspicious email or URL here..."></textarea>
                <button id="analyzeBtn">
                    Analyze
                </button>
            </div>
        </section>
        <!-- ================= RESULTS ================= -->
        <section id="results">

            <div class="card">

                <h2>Analysis Result</h2>

                <div class="status">
                    <span class="badge" id="status">
                        Waiting
                    </span>
                </div>

                <p>
                    <strong>Threat Score:</strong>
                    <span id="score">--</span>
                    
                </p>

                <p><strong>Reason:</strong></p>

                <p id="reason">
                    Click "Analyze" to begin.
                </p>
            </div>

        </section>

    </main>

    <!-- ================= FOOTER ================= -->

    <footer>

        <p>
            © 2026 PhishGuard AI. All Rights Reserved.
        </p>

    </footer>

    <script src="index.js"></script>

</body>
</html>
